<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AlgoArena Icon Design</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter&display=swap');

  body {
    background: #0a0f27;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Inter', sans-serif;
  }

 
  svg {
    width: 72px;
    height: 72px;
    filter: drop-shadow(0 0 6px #6c63ff88);
  }

  /* Neon glow effect */
  .glow-path {
    stroke: #6c63ff;
    stroke-width: 2.5;
    fill: none;
    filter: drop-shadow(0 0 6px #6c63ffdd);
    transition: stroke 0.3s ease;
  }

  /* Nodes style */
  .node {
    fill: #3ab3f9;
    stroke: #6c63ff;
    stroke-width: 2;
    filter: drop-shadow(0 0 6px #3ab3f9cc);
    transition: fill 0.3s ease;
  }

  /* Label text */
  .label-text {
    fill: #a0bfff;
    font-weight: 600;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    user-select: none;
  }

  .icon-container:hover .glow-path {
    stroke: #3ab3f9;
    filter: drop-shadow(0 0 10px #3ab3f9ff);
  }

  .icon-container:hover .node {
    fill: #ffffff;
    filter: drop-shadow(0 0 10px #6c63ffdd);
  }
</style>
</head>
<body>
  <div class="icon-container" aria-label="AlgoArena Icon" role="img" tabindex="0" title="AlgoArena - Algorithm Arena Icon">
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false" >
      <!-- Connection lines -->
      <path class="glow-path" d="M25 25 L50 40 L75 25" />
      <path class="glow-path" d="M25 75 L50 60 L75 75" />
      <path class="glow-path" d="M50 40 L50 60" />

      <!-- Nodes -->
      <circle class="node" cx="25" cy="25" r="8" />
      <circle class="node" cx="75" cy="25" r="8" />
      <circle class="node" cx="25" cy="75" r="8" />
      <circle class="node" cx="75" cy="75" r="8" />
      <circle class="node" cx="50" cy="50" r="10" />

      <!-- Brackets (algorithm typical symbol) -->
      <path class="glow-path" d="M17 15 L10 25 L17 35" />
      <path class="glow-path" d="M83 15 L90 25 L83 35" />
      <path class="glow-path" d="M17 65 L10 75 L17 85" />
      <path class="glow-path" d="M83 65 L90 75 L83 85" />

      <!-- Small algorithmic label -->
      <text class="label-text" x="50" y="92" text-anchor="middle" aria-hidden="true"></text>
    </svg>
  </div>
</body>
</html>
