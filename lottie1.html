<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Section</title>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 50px;
      flex-wrap: wrap;
    }
    .left {
      flex: 1;
      min-width: 300px;
    }
    .left h2 {
      color: green;
    }
    .left h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }
    .left ul {
      list-style: none;
      padding-left: 0;
    }
    .left ul li::before {
      content: "✔️";
      margin-right: 10px;
    }
    .start-button {
      margin-top: 20px;
      background: #3f6fff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    .right {
      flex: 1;
      min-width: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    lottie-player {
      max-width: 400px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="left">
      <h2>Real world Problems</h2>
      <h1>Practice to Solve Real World Problems</h1>
      <ul>
        <li>Take on challenges that truly matter.</li>
        <li>Choose by difficulty level.</li>
        <li>Explore 30+ languages and technologies.</li>
        <li>Use AI Tutor for smart tips.</li>
      </ul>
      <button class="start-button">Start Practice</button>
    </div>

    <div class="right">
      <!-- ✅ Working Lottie animation of software developer -->
      <lottie-player
        src="https://assets2.lottiefiles.com/packages/lf20_jtbfg2nb.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
    </div>
  </div>

</body>
</html>
