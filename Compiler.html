<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Compiler</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: sans-serif; background-color: #0f0f23; color: white; padding: 2rem; }
    textarea, select, button { width: 100%; margin-top: 10px; padding: 10px; }
    #output { background: #1e1e2f; padding: 1rem; white-space: pre-wrap; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Online Compiler</h1>

  <label for="language">Choose Language:</label>
  <select id="language">
    <option value="cpp">C++</option>
    <option value="c">C</option>
    <option value="py">Python</option>
    <option value="java">Java</option>
  </select>

  <label for="code">Enter your code:</label>
  <textarea id="code" rows="15" placeholder="Write your code here..."></textarea>

  <button onclick="runCode()">Run</button>

  <div id="output">Output will appear here...</div>

  <script>
    async function runCode() {
      const code = document.getElementById("code").value;
      const language = document.getElementById("language").value;

      const res = await fetch("http://localhost:5000/compile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, language })
      });

      const data = await res.json();
      document.getElementById("output").innerText = data.output || data.error || "No output";
    }
  </script>
</body>
</html>
