<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            height: 100%;
            font-family: 'Inter',sans-serif;
            background: linear-gradient(135deg, #0a0f27 0%, #000010 100%);
            color: #e0e6f6;
            overflow: hidden;
        }

        /*Subtle tech pattern overlay using SVG */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background-image: repeating-radial-gradient(circle at center,
             rgba(255 255 255 / 0.05) 0px, rgba(255 255 255 / 0.05) 1px, transparent 1px, transparent 20px),
              repeating-linear-gradient(0deg, transparent 0, transparent 19px, rgba(255 255 255 / 0.1) 20px, rgba(255 255 255 / 0.1) 21px);
            background-blend-mode: screen;
            z-index: 0;
            }

        .container{
            position: relative;
            z-index: 10;
            min-height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        h1{
            font-size: 3.5rem;
            font-weight: 700px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        /*Animated particles in canvas container*/
        #particles-js {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div id="particles-js"></div>
  <div class="container" role="main">
    <h1>LeetCode Style Background</h1>
    <p>A clean, dark coding environment with subtle tech pattern and gentle animated particles for focus and sophistication.</p>
  </div>


  
  <div class="container-1">
    
    <script>
        const canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        let width, height;

        const particles = [];
        const PARTICLE_COUNT = 80;

        class Particle {
            constructor() {
                this.reset();
            }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.radius = 1 + Math.random * 1.5;
            this.speedX = (Math.random() - 0.5) * 0.15;
            this.speedY = (Math.random() - 0.5) * 0.15;
            this.alpha = 0.1 + Math.random() * 0.15;
        }
        update(){
            this.x += this.speedX;
            this.y += this.speedY;

            if(this.x < 0 || this.x > width)this.speedX = -this.speedX;
            if(this.y < 0 || this.y > width)this.speedY = -this.speedY;
        }
        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillstyle = `rgba(108, 99, 255, ${this.alpha})`;
            ctx.fill();
        }
        }
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(1,0,0,1,0,0);
            ctx.scale(dpr, dpr);
        }
        function initParticles() {
            particles.length = 0;
            for(let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            //Draw particles and connecting lines between close particles
            particles.forEach((p, i) => {
                p.update();
                p.draw(ctx)

            for (let j= i + 1; j < particles.length; j++){
                let p2 = particles[j];
                let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(58, 179, 249, ${1 - dist / 120})`;
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
            });
            requestAnimationFrame(animate);
        }
        function setup() {
            resize();
            initParticles();
            animate();
        }

        window.addEventListener('resize', () => {
            resize();
        });

        document.getElementById('particles-js').appendChild(canvas);
        setup();

    </script>

</div>

</body>
</html>
